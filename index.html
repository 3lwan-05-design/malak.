<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You Malak Zwina 🌹</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 30%, #1f0b18 0%, #0d040a 60%, #050104 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
    }

    .cursive-font {
      font-family: 'Great Vibes', cursive;
    }

    .serif-title {
      font-family: 'Playfair Display', serif;
    }

    /* Stems drawing animation */
    .stem-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: growStem 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .stem-path-side-1 {
      stroke-dasharray: 550;
      stroke-dashoffset: 550;
      animation: growStem 3.4s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .stem-path-side-2 {
      stroke-dasharray: 550;
      stroke-dashoffset: 550;
      animation: growStem 3.5s 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes growStem {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Leaves unfolding */
    .leaf-anim {
      transform-origin: bottom center;
      transform: scale(0) rotate(15deg);
      opacity: 0;
      animation: unfoldLeaf 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes unfoldLeaf {
      to {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Rose buds and blooming petals */
    .rose-bloom-group {
      transform-origin: center;
      transform: scale(0.05);
      opacity: 0;
      animation: openRose 2.4s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
    }

    @keyframes openRose {
      0% {
        transform: scale(0.05) rotate(-15deg);
        opacity: 0;
      }
      40% {
        opacity: 1;
        transform: scale(0.45) rotate(-5deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Individual layered petals expanding */
    .outer-petal {
      transform-origin: center bottom;
      animation: petalFlourish 2.2s ease-out forwards;
    }

    @keyframes petalFlourish {
      0% {
        transform: scale(0.3) rotate(0deg);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Floating glowing elements */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: floatUp 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-260px) scale(1.3) rotate(25deg);
        opacity: 0;
      }
    }

    /* Glow pulse on completed text */
    .glow-text {
      text-shadow: 0 0 15px rgba(255, 77, 109, 0.8),
                   0 0 30px rgba(255, 117, 143, 0.5),
                   0 0 50px rgba(255, 209, 220, 0.4);
    }

    .sparkle-dot {
      position: absolute;
      background: radial-gradient(circle, #fff, transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }
  </style>
</head>

  <script>
    // State and references
    const messageCard = document.getElementById('loveMessageCard');
    const introNote = document.getElementById('introNote');
    const heartsRainContainer = document.getElementById('heartsRainContainer');
    const heartAnchor = document.getElementById('heartAnchor');
    const tapHeartsBtn = document.getElementById('tapHeartsBtn');
    const replayBtn = document.getElementById('replayBtn');
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');

    let animationComplete = false;
    let heartSpamInterval = null;

    // Web Audio Synthesizer for gentle romantic harp/chimes when blooming and interacting
    let audioCtx = null;

    function playGentleChime(freq = 523.25, type = 'sine', duration = 1.2) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        // Soft exponential envelope
        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio is optional and non-blocking
      }
    }

    // Play a gentle blooming arpeggio chord
    function playBloomMelody() {
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C major romantic chord
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          playGentleChime(freq, 'sine', 1.6);
        }, idx * 190);
      });
    }

    // Canvas background ambient dust & sparkling stars
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class DustParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedY = Math.random() * 0.4 + 0.1;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.pulse = Math.random() * 0.02 + 0.005;
        this.color = Math.random() > 0.4 ? '255, 180, 200' : '255, 255, 255';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.alpha += Math.sin(Date.now() * this.pulse) * 0.008;
        if (this.y < 0 || this.alpha < 0) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${Math.max(0.1, Math.min(0.9, this.alpha))})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255, 150, 180, 0.8)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new DustParticle());
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // Spawn floating heart at position
    function spawnFloatingHeart(x, y, customText = null) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart select-none text-2xl';
      
      const emojis = ['❤️', '💖', '🌹', '🤍', '✨', '💕', '🥰', '🌸'];
      heart.textContent = customText || emojis[Math.floor(Math.random() * emojis.length)];

      const posX = x !== undefined ? x : (window.innerWidth / 2 + (Math.random() - 0.5) * 260);
      const posY = y !== undefined ? y : (window.innerHeight * 0.68 + (Math.random() - 0.5) * 50);

      heart.style.left = `${posX}px`;
      heart.style.top = `${posY}px`;
      heart.style.fontSize = `${Math.floor(Math.random() * 18 + 20)}px`;
      heart.style.zIndex = '35';

      heartsRainContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4200);
    }

    // Sequence the blooming reveal
    function startBloomSequence() {
      // Show intro text
      setTimeout(() => {
        introNote.classList.remove('opacity-0');
        introNote.classList.add('opacity-100');
      }, 600);

      // Rose blooming triggers around 2.2s -> 4.5s
      setTimeout(() => {
        playBloomMelody();
      }, 2800);

      // Once flowers finish growing (~4.8 seconds)
      setTimeout(() => {
        revealMessage();
      }, 4800);
    }

    function revealMessage() {
      animationComplete = true;
      
      // Reveal the love message smoothly
      messageCard.classList.remove('opacity-0', 'translate-y-8');
      messageCard.classList.add('opacity-100', 'translate-y-0');

      // Chime of completion
      playGentleChime(783.99, 'sine', 2.0);

      // Continuous pleasant hearts next to the message
      if (heartSpamInterval) clearInterval(heartSpamInterval);
      
      // Burst of hearts around message
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const rect = heartAnchor.getBoundingClientRect();
          spawnFloatingHeart(rect.left + 15 + (Math.random() - 0.5) * 100, rect.top - 10 + (Math.random() - 0.5) * 50);
        }, i * 160);
      }

      // Continuous gentle floating hearts
      heartSpamInterval = setInterval(() => {
        const rect = heartAnchor.getBoundingClientRect();
        if (rect) {
          spawnFloatingHeart(
            rect.left + 15 + (Math.random() - 0.5) * 120,
            rect.top + (Math.random() - 0.5) * 40
          );
        }
      }, 800);
    }

    // Handle interactive clicks on page to spawn flowers and hearts
    window.addEventListener('pointerdown', (e) => {
      // Don't duplicate when clicking action buttons
      if (e.target.closest('button')) return;

      playGentleChime(440 + Math.random() * 300, 'sine', 0.8);

      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          spawnFloatingHeart(
            e.clientX + (Math.random() - 0.5) * 40,
            e.clientY + (Math.random() - 0.5) * 40
          );
        }, i * 90);
      }
    });

    // Button: Tap for hearts shower
    tapHeartsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playGentleChime(659.25, 'triangle', 1.0);
      
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          const x = Math.random() * window.innerWidth;
          const y = window.innerHeight * 0.7 + Math.random() * 100;
          spawnFloatingHeart(x, y);
        }, i * 90);
      }
    });

    // Button: Replay Blooming Animation
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (heartSpamInterval) clearInterval(heartSpamInterval);

      // Reset message
      messageCard.classList.remove('opacity-100', 'translate-y-0');
      messageCard.classList.add('opacity-0', 'translate-y-8');
      introNote.classList.remove('opacity-100');
      introNote.classList.add('opacity-0');

      // Re-trigger SVG animations by cloning SVG
      const svg = document.getElementById('flowerGardenSvg');
      const clone = svg.cloneNode(true);
      svg.parentNode.replaceChild(clone, svg);

      // Re-run sequence
      startBloomSequence();
    });

    // Start everything on window load
    window.onload = function () {
      startBloomSequence();
    };
  </script>
</body>
</html>
